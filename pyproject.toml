[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beta-social"
version = "0.1.0"
description = "Instagram ve TikTok hesaplarını resmi API'lerle takip eden ve onaylı içerik yayınlayan yerel otomasyon aracı."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
beta-social = "beta_social.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
